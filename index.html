<style>
:root{--gold:#c9a227;--gold2:#a8851c;--tq:#141210;--tq2:#000000;--dark:#fbf9f4;--card:#ffffff;--text:#17140e;--muted:#7a7364;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--dark);color:var(--text);line-height:1.7}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:50;background:rgba(251,249,244,.95);backdrop-filter:blur(8px);border-bottom:1px solid #ece5d2;display:flex;align-items:center;justify-content:space-between;padding:12px 5%}
.cart-btn{background:linear-gradient(135deg,var(--tq),var(--tq2));color:#e3c56f;border:1px solid var(--gold);border-radius:30px;padding:8px 18px;font-family:inherit;font-weight:700;cursor:pointer}
.hero{text-align:center;padding:70px 5% 50px;background:radial-gradient(circle at 50% 0,#f1e8cf 0,#ffffff 70%)}
.hero h1{background:linear-gradient(90deg,#8a6d1c,#d4af37,#8a6d1c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-family:'Amiri',serif;font-size:clamp(2rem,6vw,3.4rem);color:var(--gold2)}
.hero p{color:var(--muted);margin:10px auto 24px;max-width:520px}
.contact-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{padding:10px 22px;border-radius:30px;font-weight:600;border:1px solid var(--gold);color:var(--gold2)}
.pill.wa{background:#25d366;border-color:#25d366;color:#fff}
.pill.ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);border:0;color:#fff}
.tools{padding:24px 5% 0;max-width:1200px;margin:auto}
#search{width:100%;padding:12px 18px;border-radius:30px;border:1px solid #ddd2b6;background:var(--card);color:var(--text);font-family:inherit;font-size:1rem}
.cats{display:flex;gap:8px;overflow-x:auto;padding:16px 0;scrollbar-width:none}
.cats button{white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid #ddd2b6;border-radius:30px;padding:8px 20px;font-family:inherit;cursor:pointer}
.cats button.active{background:var(--tq);color:#e3c56f;border-color:var(--tq);font-weight:700}
.grid{max-width:1200px;margin:auto;padding:10px 5% 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{box-shadow:0 4px 14px rgba(0,0,0,.07);background:var(--card);border:1px solid #ece5d2;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.card:hover{transform:translateY(-4px);border-color:var(--gold)}
.img{aspect-ratio:1;background:linear-gradient(135deg,#f6efdc,#fbf3d9);display:flex;align-items:center;justify-content:center;font-size:4rem}
.img img{width:100%;height:100%;object-fit:cover}
.info{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{font-size:1.05rem}
.info .cat{color:var(--muted);font-size:.8rem}
.price{color:var(--gold2);font-weight:700;margin:4px 0}
.btns{display:flex;gap:6px;margin-top:auto}
.btns button,.btns a{flex:1;text-align:center;padding:8px;border-radius:10px;border:0;font-family:inherit;font-weight:600;cursor:pointer;font-size:.85rem}
.add{background:var(--tq);color:#e3c56f}
.wa-s{background:#25d366;color:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
/* cart */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:90}
.overlay.open{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(420px,100%);background:#fff;box-shadow:4px 0 24px rgba(0,0,0,.15);z-index:100;transform:translateX(-100%);transition:.3s;display:flex;flex-direction:column;padding:18px}
.drawer.open{transform:none}
.drawer h2{color:var(--gold2);margin-bottom:10px;display:flex;justify-content:space-between}
.drawer h2 span{cursor:pointer}
#items{flex:1;overflow:auto}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ece5d2;gap:8px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold2);cursor:pointer}
.qty span{margin:0 8px}
.drawer input,.drawer textarea{width:100%;margin-top:8px;padding:10px 14px;border-radius:10px;border:1px solid #ddd2b6;background:var(--card);color:var(--text);font-family:inherit}
.total{display:flex;justify-content:space-between;font-weight:700;margin:12px 0 4px;color:var(--gold2)}
.send{width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;background:#25d366;color:#fff}
.send.ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}
footer{text-align:center;padding:30px 5%;border-top:1px solid #ece5d2;color:var(--muted);font-size:.85rem}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tq);color:#e3c56f;padding:10px 22px;border-radius:30px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:200}
.toast.show{opacity:1}
</style>

.mark{position:relative;background:center/contain no-repeat}
.mark.full{background-image:var(--logo);aspect-ratio:0.8344}
.mark.emblem{background-image:var(--emblem);aspect-ratio:1.3402}
.mark::after{content:"";position:absolute;inset:0;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat;background:linear-gradient(110deg,transparent 38%,#e8c65a 50%,transparent 62%);background-size:260% 100%;background-position:160% 0;animation:shine 5s ease-in-out infinite}
.mark.full::after{-webkit-mask-image:var(--logo);mask-image:var(--logo)}
.mark.emblem::after{-webkit-mask-image:var(--emblem);mask-image:var(--emblem)}
@keyframes shine{0%,55%{background-position:160% 0}100%{background-position:-60% 0}}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.brand .emblem{height:52px;transition:height .35s ease}
header.scrolled .emblem{height:38px}
header{transition:padding .35s ease,box-shadow .35s}
header.scrolled{padding-top:7px;padding-bottom:7px;box-shadow:0 6px 20px rgba(0,0,0,.07)}
.brand-name{font-family:'Amiri',serif;font-size:1.35rem;line-height:1.15;color:var(--text)}
.brand-name small{display:block;font-family:'Cairo',sans-serif;font-size:.6rem;letter-spacing:3px;color:var(--gold2)}
.hero-logo{width:min(250px,60vw);margin:0 auto 16px;perspective:700px;animation:float 6s ease-in-out infinite;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hero-logo .tilt{transition:transform .2s ease-out,filter .3s;transform-style:preserve-3d;filter:drop-shadow(0 10px 18px rgba(201,162,39,.22));animation:rise 1.2s .15s cubic-bezier(.2,.8,.2,1) backwards}
.hero-logo:hover .tilt{filter:drop-shadow(0 16px 28px rgba(201,162,39,.5))}
.hero-logo.pop .mark{animation:pop .6s ease}
.hero-logo.pop .mark::after{animation:shine 1s ease-in-out 1}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rise{from{opacity:0;transform:scale(.88) translateY(14px);filter:blur(6px)}to{opacity:1;transform:none}}
#splash{position:fixed;inset:0;z-index:999;background:#fbf9f4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .8s,visibility .8s;cursor:pointer}
#splash.hide{opacity:0;visibility:hidden}
#splash .mark{width:min(270px,64vw);animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
#splash .mark::after{animation:shine 1.8s .8s ease-in-out 1}
#splash .line{height:2px;width:0;background:linear-gradient(90deg,transparent,#c9a227,transparent);animation:draw 1.6s .6s forwards}
@keyframes draw{to{width:min(230px,52vw)}}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>

<style>
.hdr-actions{display:flex;gap:8px;align-items:center}
.owner-btn{background:transparent;color:var(--text);border:1px solid var(--gold);border-radius:30px;padding:8px 14px;font-family:inherit;font-weight:700;cursor:pointer;font-size:.85rem}
.owner-btn:hover{background:var(--tq);color:#e3c56f}
.send.site{background:var(--tq);color:#e3c56f}
.pdesc{color:var(--muted);font-size:.82rem;line-height:1.5}
.img{position:relative}.ph{font-size:3.4rem;opacity:.55}
.badge{position:absolute;top:10px;right:10px;background:#000;color:#e3c56f;border-radius:20px;padding:2px 12px;font-size:.8rem}
.card.soldout .img img{filter:grayscale(.7);opacity:.7}
.hdr-actions button{white-space:nowrap}.brand-name{white-space:nowrap}
@media(max-width:480px){.owner-btn{padding:7px 10px;font-size:.75rem}.brand-name{font-size:1rem}.brand-name small{font-size:.5rem;letter-spacing:2px}.brand .emblem{height:40px}header.scrolled .emblem{height:32px}.cart-btn{padding:8px 11px;font-size:.78rem}.brand{gap:8px}header{padding-left:3%;padding-right:3%}}

<div id="splash"><div class="mark full" role="img" aria-label="Ahmed Misk"></div><div class="line"></div></div>

<header>
  <a class="brand" href="#top" aria-label="مجوهرات أحمد مسك"><span class="mark emblem" role="img" aria-label="شعار أحمد مسك"></span><span class="brand-name">مجوهرات أحمد مسك<small>AHMED MISK</small></span></a>
  <div class="hdr-actions"><button class="owner-btn" id="ownerBtn" type="button">🔐 المالك</button><button class="cart-btn" onclick="toggleCart(true)">🛒 السلة (<span id="count">0</span>)</button></div>
</header>

<section class="hero">
  <div class="hero-logo" id="heroLogo"><div class="tilt"><div class="mark full" role="img" aria-label="شعار مجوهرات أحمد مسك"></div></div></div>
  <h1 id="heroTitle">أناقة تدوم مدى الحياة</h1>
  <p id="heroText">اكتشف مجموعتنا من الذهب والمجوهرات الفاخرة. اختر، اطلب، ونوصلك لباب بيتك.</p>
  <div class="contact-row">
    <a class="pill wa" id="waTop" target="_blank">واتساب</a>
    <a class="pill ig" id="igTop" target="_blank">انستغرام</a>
  </div>
</section>

<div class="tools">
  <input id="search" placeholder="🔍 ابحث عن منتج...">
  <div class="cats" id="cats"></div>
</div>
<div class="grid" id="grid"></div>

<footer>© <span id="yr"></span> مجوهرات أحمد مسك — جميع الحقوق محفوظة</footer>

<div class="overlay" id="ov" onclick="toggleCart(false)"></div>
<aside class="drawer" id="drawer">
  <h2>سلة الطلبات <span onclick="toggleCart(false)">✕</span></h2>
  <div id="items"></div>
  <div class="total"><span>المجموع</span><span id="total">0</span></div>
  <input id="cname" placeholder="الاسم">
  <input id="cphone" placeholder="رقم الهاتف" inputmode="tel">
  <textarea id="caddr" rows="2" placeholder="العنوان (المحافظة / المنطقة)"></textarea>
  <button class="send site" onclick="sendOrder('site')">تأكيد الطلب عبر الموقع</button>
  <button class="send" onclick="sendOrder('wa')">إرسال الطلب عبر واتساب</button>
  <button class="send ig" onclick="sendOrder('ig')">إرسال الطلب عبر انستغرام</button>
</aside>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
/* ===== بيانات المتجر تأتي من الخادم (لوحة المالك) ===== */
const FALLBACK = {
  settings:{whatsapp:"9647XXXXXXXXX",instagram:"your_instagram",currency:"د.ع",heroTitle:"أناقة تدوم مدى الحياة",heroText:"اكتشف مجموعتنا من الذهب والمجوهرات الفاخرة. اختر، اطلب، ونوصلك لباب بيتك."},
  products:[
    {id:1,name:"خاتم سوليتير ذهب 21",cat:"خواتم",price:450000,image:"",available:true},
    {id:3,name:"سوار ذهب إيطالي",cat:"أساور",price:620000,image:"",available:true},
    {id:5,name:"قلادة بحرف اسم",cat:"قلادات",price:290000,image:"",available:true},
    {id:9,name:"طقم عروس كامل",cat:"أطقم",price:2400000,image:"",available:true}
  ]
};
let SETTINGS = FALLBACK.settings, PRODUCTS = FALLBACK.products, ONLINE = false;
let cart = {}; try{cart = JSON.parse(localStorage.getItem('cart')||'{}')}catch(e){}
let activeCat = 'الكل', q = '';
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US') + ' ' + SETTINGS.currency;
const waLink = t => `https://wa.me/${SETTINGS.whatsapp}?text=${encodeURIComponent(t)}`;
const igLink = () => `https://ig.me/m/${SETTINGS.instagram}`;

const mapSettings = r => ({whatsapp:r.whatsapp,instagram:r.instagram,currency:r.currency,heroTitle:r.hero_title,heroText:r.hero_text});
const mapProduct = r => ({id:+r.id,name:r.name,cat:r.cat,price:+r.price,desc:r.descr||'',image:SB.img(r.image),available:r.available!==false});
async function loadStore(){
  try{
    if(!SB.ready) throw 0;
    const [st,pr] = await Promise.all([SB.get('settings?id=eq.1&select=*'),SB.get('products?select=*&order=id.desc')]);
    if(st[0]) SETTINGS = mapSettings(st[0]);
    PRODUCTS = pr.map(mapProduct); ONLINE = true;
  }catch(e){ ONLINE = false; }
  applySettings(); renderCats(); renderGrid(); renderCart();
}
function applySettings(){
  $('yr').textContent = new Date().getFullYear();
  $('waTop').href = waLink('السلام عليكم، أريد الاستفسار عن منتجاتكم');
  $('igTop').href = `https://instagram.com/${encodeURIComponent(SETTINGS.instagram)}`;
  if(SETTINGS.heroTitle) $('heroTitle').textContent = SETTINGS.heroTitle;
  if(SETTINGS.heroText) $('heroText').textContent = SETTINGS.heroText;
}

function renderCats(){
  const cats = ['الكل', ...new Set(PRODUCTS.map(p=>p.cat))];
  if(!cats.includes(activeCat)) activeCat='الكل';
  $('cats').innerHTML = cats.map(c=>`<button data-cat="${esc(c)}" class="${c===activeCat?'active':''}">${esc(c)}</button>`).join('');
}
$('cats').addEventListener('click',e=>{const b=e.target.closest('button[data-cat]');if(b){activeCat=b.dataset.cat;renderCats();renderGrid()}});
$('search').oninput = e => {q=e.target.value.trim();renderGrid()};

function renderGrid(){
  const list = PRODUCTS.filter(p=>(activeCat==='الكل'||p.cat===activeCat)&&p.name.includes(q));
  $('grid').innerHTML = list.length ? list.map(p=>`
    <div class="card${p.available===false?' soldout':''}">
      <div class="img">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:'<span class="ph">💎</span>'}${p.available===false?'<b class="badge">نفد</b>':''}</div>
      <div class="info">
        <span class="cat">${esc(p.cat)}</span>
        <h3>${esc(p.name)}</h3>
        ${p.desc?`<p class="pdesc">${esc(p.desc)}</p>`:''}
        <div class="price">${fmt(p.price)}</div>
        <div class="btns">
          ${p.available===false?'<button disabled style="opacity:.5">غير متوفر</button>':`<button class="add" onclick="add(${+p.id})">أضف للسلة</button>`}
          <a class="wa-s" target="_blank" rel="noopener" href="${waLink('أريد طلب: '+p.name+' — '+fmt(p.price))}">واتساب</a>
        </div>
      </div>
    </div>`).join('') : '<div class="empty">لا توجد منتجات مطابقة</div>';
}

function save(){try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}renderCart()}
function add(id){cart[id]=(cart[id]||0)+1;save();toast('تمت الإضافة للسلة ✓')}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save()}
function renderCart(){
  const ids = Object.keys(cart);
  let total=0, n=0;
  const rows = ids.map(id=>{
    const p=PRODUCTS.find(x=>x.id==id); if(!p) return '';
    total+=p.price*cart[id]; n+=cart[id];
    return `<div class="item"><div>${esc(p.name)}<br><small>${fmt(p.price)}</small></div>
      <div class="qty"><button onclick="chg(${+id},1)">+</button><span>${cart[id]}</span><button onclick="chg(${+id},-1)">−</button></div></div>`;
  }).join('');
  $('items').innerHTML = rows || '<p style="color:var(--muted);padding:20px 0">السلة فارغة</p>';
  $('total').textContent = fmt(total); $('count').textContent = n;
}
function toggleCart(o){$('drawer').classList.toggle('open',o);$('ov').classList.toggle('open',o)}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}

async function sendOrder(via){
  const ids=Object.keys(cart).filter(id=>PRODUCTS.find(x=>x.id==id));
  if(!ids.length) return toast('السلة فارغة');
  const name=$('cname').value.trim(), phone=$('cphone').value.trim(), addr=$('caddr').value.trim();
  if(!name||!phone||!addr) return toast('يرجى ملء الاسم والهاتف والعنوان');
  let total=0;
  const lines=ids.map(id=>{const p=PRODUCTS.find(x=>x.id==id);total+=p.price*cart[id];return `• ${p.name} × ${cart[id]} = ${fmt(p.price*cart[id])}`});
  const msg=`طلب جديد 🛍️\n${lines.join('\n')}\n\nالمجموع: ${fmt(total)}\nالاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${addr}`;
  if(via==='wa'){ window.open(waLink(msg),'_blank'); }
  else if(via==='ig'){ navigator.clipboard&&navigator.clipboard.writeText(msg); toast('تم نسخ الطلب، الصقه في المحادثة'); window.open(igLink(),'_blank'); }
  else {
    if(!ONLINE) return toast('الطلب عبر الموقع غير مفعّل بعد');
    try{
      const id = await SB.rpc('place_order',{p_name:name,p_phone:phone,p_address:addr,p_items:ids.map(id=>({id:+id,qty:cart[id]}))});
      cart={};save();toggleCart(false);
      toast('تم استلام طلبك رقم #'+id+' ✓ سنتواصل معك قريباً');
    }catch(e){toast(e.message||'تعذر إرسال الطلب')}
  }
}

loadStore(); renderCart();
</script>
<script>
(function(){
  var s=document.getElementById('splash'),seen=false;
  try{seen=sessionStorage.getItem('splashSeen')}catch(e){}
  if(seen||matchMedia('(prefers-reduced-motion: reduce)').matches){s.remove()}
  else{
    document.body.style.overflow='hidden';
    var done=function(){s.classList.add('hide');document.body.style.overflow='';try{sessionStorage.setItem('splashSeen','1')}catch(e){}setTimeout(function(){s.remove()},900)};
    setTimeout(done,2800);s.addEventListener('click',done);
  }
  var hd=document.querySelector('header');
  var onScroll=function(){hd.classList.toggle('scrolled',window.scrollY>40)};
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  var hl=document.getElementById('heroLogo'),t=hl.querySelector('.tilt');
  hl.addEventListener('pointermove',function(e){
    var r=hl.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    t.style.transform='rotateY('+(x*26)+'deg) rotateX('+(-y*26)+'deg) scale(1.05)';
  });
  var reset=function(){t.style.transform=''};
  hl.addEventListener('pointerleave',reset);hl.addEventListener('pointerup',reset);
  hl.addEventListener('click',function(){hl.classList.remove('pop');void hl.offsetWidth;hl.classList.add('pop')});
  document.querySelector('.brand').addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})});
})();
</script>
<script src="owner.js" defer></script>
</body>
</html>
